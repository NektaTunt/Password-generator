<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="upper-content">
        <h1 class="generate">Generate a <span id="green-color">random password</span></h1>
        <h2 class="insecure">Never use an insecure password again.</h2>
        <button onclick="showPass()" class="gnr-btn">Generate passwords</button>
        
    </div>
    <div class="underline"></div>
    <div class="bottom-content">
        <h2 class="display-pass" id="pass-one">1234567890</h2>
        <h2 class="display-pass" id="pass-two">1234567890</h2>
    </div>
    <script src="PassGen.js"></script>
</body>
</html>
